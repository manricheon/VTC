[project]
name = "vtc-divt-llava15-eval-env"
version = "0.1.0"
description = "Isolated lmms-eval environment skeleton for DiVT LLaVA-1.5 evaluation."
requires-python = ">=3.11"
dependencies = [
    "lmms-eval",
    "vtc-projector-eval",
    "llava",
]

[tool.uv.sources]
lmms-eval = { path = "../../external/lmms-eval", editable = true }
vtc-projector-eval = { path = "../../projects/projector-eval-harness", editable = true }
llava = { path = "../../external/DiVT", editable = true }

[tool.uv]
package = false
