[project]
name = "vtc-fourier-llava15-eval-env"
version = "0.1.0"
description = "Isolated lmms-eval environment skeleton for Fourier-Compressor on LLaVA-1.5."
requires-python = ">=3.11"
dependencies = [
    "lmms-eval",
    "vtc-projector-eval",
    "Fourier-Compressor",
]

[tool.uv.sources]
lmms-eval = { path = "../../external/lmms-eval", editable = true }
vtc-projector-eval = { path = "../../projects/projector-eval-harness", editable = true }
Fourier-Compressor = { path = "../../external/Fourier-Compressor", editable = true }

[tool.uv]
package = false
