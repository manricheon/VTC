[project]
name = "vtc-bridge-core-env"
version = "0.1.0"
description = "Linux-target uv environment for VTC bridge-core development."
requires-python = ">=3.11"
dependencies = [
    "gaze-ov-bridge",
    "vtc-projector-eval",
    "numpy>=1.24",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.uv.sources]
gaze-ov-bridge = { path = "../../projects/gaze-ov-bridge", editable = true }
vtc-projector-eval = { path = "../../projects/projector-eval-harness", editable = true }
